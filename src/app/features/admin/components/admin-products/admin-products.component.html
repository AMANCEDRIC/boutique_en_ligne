<div class="space-y-5">
  <!-- Barre d'outils -->
  <div class="flex flex-col sm:flex-row gap-3 sm:items-center">
    <input [(ngModel)]="search" placeholder="Rechercher un article…" type="search"
      class="flex-1 border border-maison-light-gray bg-white px-3 py-3 text-sm focus:border-black outline-none" />
    <button (click)="openNew()" class="bg-black text-white px-8 py-3.5 label-caps text-[10px] hover:bg-black/90 whitespace-nowrap">
      + Nouvel article
    </button>
  </div>

  <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
    <button (click)="sectionFilter = 'all'" class="px-4 py-2 border text-[10px] font-semibold uppercase tracking-wide whitespace-nowrap"
      [ngClass]="sectionFilter === 'all' ? 'bg-black text-white border-black' : 'bg-white border-maison-light-gray text-gray-500'">
      Tout ({{ products.length }})
    </button>
    <button *ngFor="let s of sections" (click)="sectionFilter = s.id"
      class="px-4 py-2 border text-[10px] font-semibold uppercase tracking-wide whitespace-nowrap"
      [ngClass]="sectionFilter === s.id ? 'bg-black text-white border-black' : 'bg-white border-maison-light-gray text-gray-500'">
      {{ s.id }}
    </button>
  </div>

  <!-- État vide -->
  <div *ngIf="!products.length" class="bg-white border border-maison-light-gray p-8 sm:p-12 text-center space-y-5">
    <p class="font-serif text-xl">Aucun article pour l’instant</p>
    <p class="text-sm text-gray-500">Ajoutez votre premier article avec ses photos, ou importez les articles de démonstration.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button (click)="openNew()" class="bg-black text-white px-8 py-3.5 label-caps text-[10px]">+ Nouvel article</button>
      <button (click)="importDemo()" [disabled]="importing" class="border border-black px-8 py-3.5 label-caps text-[10px] disabled:opacity-40">
        {{ importing ? 'Import…' : 'Importer les articles de démo' }}
      </button>
    </div>
  </div>

  <!-- Liste -->
  <div *ngIf="products.length" class="bg-white border border-maison-light-gray divide-y divide-maison-light-gray">
    <div *ngFor="let p of filtered" class="flex gap-3 sm:gap-5 p-3 sm:p-4 items-center">
      <button (click)="openEdit(p)" class="relative w-16 h-20 sm:w-20 sm:h-24 shrink-0 bg-maison-greige overflow-hidden">
        <img [src]="thumb(p)" [alt]="p.name" class="w-full h-full object-cover" loading="lazy" />
        <span *ngIf="hasVideo(p)" class="absolute bottom-1 right-1 bg-black/70 text-white text-[8px] px-1">▶</span>
      </button>

      <div class="flex-1 min-w-0 space-y-1">
        <button (click)="openEdit(p)" class="block text-left text-sm font-medium truncate max-w-full hover:underline">{{ p.name }}</button>
        <p class="text-[10px] uppercase tracking-wide text-gray-400 truncate">{{ p.mainCategory }} · {{ p.category }}</p>
        <p class="text-sm font-semibold">{{ formatPrice(p.price) }}</p>
        <div class="flex gap-1.5 flex-wrap">
          <span *ngIf="p.isNew" class="text-[8px] uppercase font-bold bg-black text-white px-1.5 py-0.5">Nouveau</span>
          <span *ngIf="p.isSale" class="text-[8px] uppercase font-bold bg-maison-gold text-white px-1.5 py-0.5">Promo</span>
          <span *ngIf="p.stock <= 0" class="text-[8px] uppercase font-bold border border-red-300 text-red-600 px-1.5 py-0.5">Épuisé</span>
        </div>
      </div>

      <!-- Stock -->
      <div class="hidden sm:flex items-center border border-maison-light-gray">
        <button (click)="adjustStock(p, -1)" class="w-9 h-9 text-lg" aria-label="Retirer une pièce">−</button>
        <span class="w-10 text-center text-sm" [class.text-red-600]="p.stock <= 0">{{ p.stock }}</span>
        <button (click)="adjustStock(p, 1)" class="w-9 h-9 text-lg" aria-label="Ajouter une pièce">+</button>
      </div>

      <div class="grid grid-cols-1 sm:flex sm:flex-row gap-1 sm:gap-2 shrink-0">
        <button (click)="copyLink(p)" class="p-2.5 border hover:border-black relative" aria-label="Copier le lien"
          [ngClass]="copiedId === p.id ? 'border-green-600 text-green-700' : 'border-maison-light-gray'">
          <svg *ngIf="copiedId !== p.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.4" stroke-linecap="round" d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>
          <svg *ngIf="copiedId === p.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        </button>
        <button (click)="openEdit(p)" class="p-2.5 border border-maison-light-gray hover:border-black" aria-label="Modifier">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.4" d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
        </button>
        <button (click)="remove(p)" class="p-2.5 border border-maison-light-gray hover:border-red-500 hover:text-red-600" aria-label="Supprimer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.4" d="M5 7h14M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </div>
    </div>

    <p *ngIf="!filtered.length" class="p-8 text-center text-sm text-gray-400">Aucun article ne correspond.</p>
  </div>
</div>

<app-admin-product-form *ngIf="editing !== undefined" [product]="editing" (closed)="onFormClosed($event)"></app-admin-product-form>
