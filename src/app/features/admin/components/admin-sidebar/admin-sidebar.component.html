<!-- Desktop : barre latérale -->
<aside class="hidden lg:flex lg:flex-col h-screen w-64 bg-black text-white p-8 fixed left-0 top-0 z-30">
  <div class="mb-12">
    <h2 class="font-script text-[34px] leading-none">Maison Shein</h2>
    <p class="label-caps text-[8px] text-gray-500 mt-2 tracking-[0.4em]">Administration</p>
  </div>

  <nav class="space-y-1 flex-grow">
    <button
      *ngFor="let t of tabs"
      (click)="tabChange.emit(t.id)"
      class="w-full text-left py-3 px-4 label-caps text-[10px] relative flex items-center gap-3"
      [ngClass]="activeTab === t.id ? 'text-white bg-white/5' : 'text-gray-400 hover:text-white'"
    >
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path [attr.d]="t.icon" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="flex-grow">{{ t.label }}</span>
      <span *ngIf="t.id === 'orders' && pendingOrders" class="bg-maison-gold text-black text-[9px] px-1.5 min-w-[18px] text-center">{{ pendingOrders }}</span>
      <span *ngIf="activeTab === t.id" class="absolute left-0 top-0 w-1 h-full bg-maison-gold"></span>
    </button>
  </nav>

  <div class="pt-6 border-t border-white/10 space-y-1">
    <a routerLink="/" target="_blank" class="w-full py-3 px-4 label-caps text-[9px] text-gray-400 hover:text-white flex items-center gap-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.2" d="M14 3h7v7m0-7L10 14M5 5h4M5 5v14h14v-4"/></svg>
      Voir la boutique
    </a>
    <button (click)="logout.emit()" class="w-full py-3 px-4 label-caps text-[9px] text-gray-400 hover:text-white flex items-center gap-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.2" d="M15 12H3m0 0l4-4m-4 4l4 4M10 4h10v16H10"/></svg>
      Déconnexion
    </button>
  </div>
</aside>

<!-- Mobile : en-tête + barre d'onglets en bas -->
<header class="lg:hidden fixed top-0 inset-x-0 z-30 h-14 bg-black text-white flex items-center justify-between px-4">
  <span class="font-script text-[26px] leading-none">Maison Shein</span>
  <div class="flex items-center gap-1">
    <a routerLink="/" target="_blank" aria-label="Voir la boutique" class="p-2.5 text-gray-300">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.4" d="M14 3h7v7m0-7L10 14M5 5h4M5 5v14h14v-4"/></svg>
    </a>
    <button (click)="logout.emit()" aria-label="Déconnexion" class="p-2.5 text-gray-300">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.4" d="M15 12H3m0 0l4-4m-4 4l4 4M10 4h10v16H10"/></svg>
    </button>
  </div>
</header>

<nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-maison-light-gray grid grid-cols-5 pb-[env(safe-area-inset-bottom)]">
  <button
    *ngFor="let t of tabs"
    (click)="tabChange.emit(t.id)"
    class="relative flex flex-col items-center justify-center gap-1 py-2.5"
    [ngClass]="activeTab === t.id ? 'text-black' : 'text-gray-400'"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path [attr.d]="t.icon" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="text-[9px] font-semibold uppercase tracking-wide">{{ t.short }}</span>
    <span *ngIf="t.id === 'orders' && pendingOrders" class="absolute top-1.5 right-[22%] bg-maison-gold text-black text-[8px] font-bold px-1 min-w-[14px] text-center">{{ pendingOrders }}</span>
    <span *ngIf="activeTab === t.id" class="absolute top-0 inset-x-4 h-0.5 bg-black"></span>
  </button>
</nav>
