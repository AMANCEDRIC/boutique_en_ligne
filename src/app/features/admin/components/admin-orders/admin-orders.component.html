<div class="space-y-5">
  <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
    <button *ngFor="let s of statuses" (click)="statusFilter = s"
      class="px-4 py-2 border text-[10px] font-semibold uppercase tracking-wide whitespace-nowrap"
      [ngClass]="statusFilter === s ? 'bg-black text-white border-black' : 'bg-white border-maison-light-gray text-gray-500'">
      {{ s }} ({{ count(s) }})
    </button>
    <button (click)="statusFilter = 'all'"
      class="px-4 py-2 border text-[10px] font-semibold uppercase tracking-wide whitespace-nowrap"
      [ngClass]="statusFilter === 'all' ? 'bg-black text-white border-black' : 'bg-white border-maison-light-gray text-gray-500'">
      Toutes ({{ orders.length }})
    </button>
  </div>

  <div *ngIf="!filtered.length" class="bg-white border border-maison-light-gray p-10 text-center text-sm text-gray-400">
    Aucune commande ici.
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-2 gap-3 sm:gap-4">
    <div *ngFor="let o of filtered" class="bg-white border border-maison-light-gray p-4 sm:p-6 space-y-4">
      <div class="flex justify-between items-start gap-3">
        <div class="min-w-0">
          <p class="font-mono text-xs text-gray-400">{{ o.ref }} · {{ o.createdAt | date: 'dd/MM/yyyy HH:mm' }}</p>
          <p class="font-medium mt-1 truncate">{{ o.customerName }}</p>
          <p class="text-xs text-gray-500 truncate">{{ o.customerDistrict ? o.customerDistrict + ', ' : '' }}{{ o.customerAddress }}</p>
        </div>
        <span class="px-2.5 py-1 text-[9px] font-bold uppercase border shrink-0" [ngClass]="statusClass(o.status)">{{ o.status }}</span>
      </div>

      <div class="flex justify-between text-sm border-t border-maison-light-gray pt-3">
        <span class="text-gray-500">{{ itemCount(o) }} article(s)</span>
        <span class="font-semibold">{{ formatPrice(o.total) }}</span>
      </div>

      <div class="flex flex-wrap gap-2">
        <a [href]="chatLink(o)" target="_blank" class="flex-1 min-w-[120px] text-center bg-[#25D366] text-white py-2.5 text-[10px] font-bold uppercase tracking-wide">
          WhatsApp
        </a>
        <button *ngIf="o.status === 'En attente'" (click)="set(o, 'Expédié')" class="flex-1 min-w-[100px] border border-black py-2.5 text-[10px] font-bold uppercase tracking-wide">
          Expédier
        </button>
        <button *ngIf="o.status === 'En attente' || o.status === 'Expédié'" (click)="set(o, 'Livré')" class="flex-1 min-w-[100px] bg-black text-white py-2.5 text-[10px] font-bold uppercase tracking-wide">
          Livrée
        </button>
        <a [routerLink]="['/admin/order', o.id]" class="flex-1 min-w-[100px] text-center border border-maison-light-gray py-2.5 text-[10px] font-bold uppercase tracking-wide">
          Détails
        </a>
      </div>
    </div>
  </div>
</div>
